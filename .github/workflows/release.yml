name: release

# Builds the binaries the install script downloads. Tag a release to publish:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The install script resolves /releases/latest and fetches basa-<os>-<arch> plus
# checksums.txt from the release assets, so the asset names here and the ones in
# scripts/install.sh have to stay in step.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Never ship a tag that does not pass its own tests.
      - name: Check
        run: make check

      - name: Build all platforms
        run: make build-all VERSION=${GITHUB_REF_NAME#v}

      # The binary already carries these (basa licenses), which is what the MIT
      # and BSD notice obligations actually require. Attaching them as an asset
      # too means a reviewer can read the notices without running an unfamiliar
      # binary first.
      - name: Collect third-party notices
        run: |
          {
            echo "basa $GITHUB_REF_NAME - third-party licence notices"
            echo "Verbatim copies of every licence linked into the binary."
            for f in internal/licenses/*.txt; do
              echo
              printf '=%.0s' $(seq 78); echo
              echo "$f"
              echo
              cat "$f"
            done
          } > dist/THIRD-PARTY-NOTICES.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/basa-* dist/checksums.txt dist/THIRD-PARTY-NOTICES.txt
